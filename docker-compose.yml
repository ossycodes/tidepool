services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tidepool
      POSTGRES_PASSWORD: tidepool
      POSTGRES_DB: tidepool
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tidepool']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'

  # Catches all outgoing mail locally; web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
