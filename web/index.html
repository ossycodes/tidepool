<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Every blog you follow, in one email a week — even the ones without an RSS feed." />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('tidepool.theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#151412'
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Tidepool</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
