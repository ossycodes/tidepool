# Deploys the web app to Cloudflare (usetidepool.app) on every push to main
# that touches web/. Tests gate the deploy. See docs/Runbooks/Deploy the web app.md.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build:cloudflare

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          # The action defaults to Wrangler 3, which can't deploy an
          # assets-only Worker; match the version we deploy with locally.
          wranglerVersion: '4.143.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
