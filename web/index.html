<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Every blog you follow, in one email a week — even the ones without an RSS feed." />
    <!-- Link previews (WhatsApp, X, LinkedIn, Slack…). Crawlers don't run JS, so these are static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tidepool" />
    <meta property="og:title" content="Tidepool: every blog you follow, in one email a week" />
    <meta property="og:description" content="Add any blog, even the ones without an RSS feed. Once a week, Tidepool sends a single, quiet email with everything new." />
    <meta property="og:url" content="https://usetidepool.app/" />
    <meta property="og:image" content="https://usetidepool.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tidepool: every blog you follow, in one email a week, beside a sample weekly digest." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('tidepool.theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#151412'
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Tidepool</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
