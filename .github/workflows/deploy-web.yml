# Deploys the web app to Cloudflare (usetidepool.app) on every push to main
# that touches web/. Tests gate the deploy. See docs/Runbooks/Deploy the web app.md.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

# The job only reads the repo; Cloudflare access comes from its own token.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); the comment says
# which release each SHA is.
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build:cloudflare

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          # The action defaults to Wrangler 3, which can't deploy an
          # assets-only Worker; match the version we deploy with locally.
          wranglerVersion: '4.143.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
